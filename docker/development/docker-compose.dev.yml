version: "3.9"

services:
  nextjs-dev:
    container_name: taskflow-next-dev
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile.dev

    ports:
      - "3000:3000"

    volumes:
      - ../../:/app
      - /app/node_modules

    env_file:
      - ../../.env

    restart: unless-stopped